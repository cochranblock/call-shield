[package]
name = "call-shield"
version = "0.2.0"
edition = "2024"
license = "Unlicense"
description = "On-device call screening without the cloud"
repository = "https://github.com/cochranblock/call-shield"
documentation = "https://cochranblock.github.io/call-shield/"
keywords = ["call-screening", "privacy", "on-device", "spam-filter"]
categories = ["command-line-utilities"]

[dependencies]

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.diamond]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false
split-debuginfo = "off"
